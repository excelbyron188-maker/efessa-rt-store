<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your account — EFESSA RT</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/sections.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-top">
      <div class="container">
        <p class="eyebrow">WELCOME TO YOUR EFESSA RT</p>
        <h1>Your <em>account.</em></h1>
        <p>Keep your customer details together for this browser demo.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="info-card" style="max-width:650px;margin:auto">
          <h2>Create your profile</h2>

          <form id="account-form">
            <div class="form-field">
              <label for="full-name">Full name</label>
              <input id="full-name" name="name" required>
            </div>

            <div class="form-field">
              <label for="account-email">Email address</label>
              <input id="account-email" name="email" type="email" required>
            </div>

            <div class="form-field">
              <label for="account-phone">Phone number</label>
              <input id="account-phone" name="phone" type="tel" required>
            </div>

            <div class="form-field">
              <label for="account-address">Delivery address</label>
              <textarea id="account-address" name="address" required></textarea>
            </div>

            <button class="button button-primary" type="submit">
              Save profile
            </button>
          </form>

          <p class="form-note">
            This demo saves your profile in this browser only.
            It is not secure authentication and does not sync across devices.
          </p>

          <div id="account-message" aria-live="polite"></div>
          <a class="text-link" href="orders.html">View my orders ↗</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/favorites.js"></script>
  <script src="../js/main.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("#account-form");
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem("efessa-account") || "null");
      } catch {
        saved = null;
      }

      if (saved) {
        form.name.value = saved.name || "";
        form.email.value = saved.email || "";
        form.phone.value = saved.phone || "";
        form.address.value = saved.address || "";
      }

      form.addEventListener("submit", event => {
        event.preventDefault();

        const profile = {
          name: form.name.value.trim(),
          email: form.email.value.trim(),
          phone: form.phone.value.trim(),
          address: form.address.value.trim()
        };

        localStorage.setItem("efessa-account", JSON.stringify(profile));

        document.querySelector("#account-message").textContent =
          "Your profile was saved in this browser.";
      });
    });
  </script>
</body>
</html>
